<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Properties – Nestora</title>
  <meta name="description" content="Search homes for sale and rent. Filter by type, bedrooms and price.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="page-hero container">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a> / <span>Properties</span></nav>
      <h1>Find your next home</h1>
      <p>Filter by what matters to you. Tap a photo for a quick look, or the title for the full story.</p>

      <div class="filters glass">
        <div class="segmented" role="group" aria-label="Buy or rent">
          <button type="button" class="is-active" data-status="buy">For sale</button>
          <button type="button" data-status="rent">For rent</button>
        </div>
        <input class="field" id="q" type="search" placeholder="Search by name, city or neighbourhood" aria-label="Search">
        <select class="field" id="type" aria-label="Property type"><option value="all">All types</option><option>House</option><option>Apartment</option><option>Villa</option><option>Condo</option></select>
        <select class="field" id="beds" aria-label="Bedrooms"><option value="0">Any beds</option><option value="1">1+ beds</option><option value="2">2+ beds</option><option value="3">3+ beds</option><option value="4">4+ beds</option></select>
        <select class="field" id="maxPrice" aria-label="Maximum price"></select>
        <select class="field" id="sort" aria-label="Sort"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="size">Largest first</option></select>
      </div>

      <div class="results"><strong id="resultCount"></strong><button class="clear" type="button" id="clearBtn">Clear filters</button></div>
      <div class="grid" id="grid"></div>

      <div class="notfound glass">
        <div><h3>Can’t find the right home?</h3><p>Tell us what you are after. We hear about homes before they are listed.</p></div>
        <a class="btn" href="contact.html">Talk to an agent</a>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/art.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
  <script src="js/properties.js"></script>
</body>
</html>
